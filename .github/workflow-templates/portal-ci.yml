name: CI
# Portal quality gate: install private @coderic packages, run Vitest, optional build.
# uses: owner/repo/path@ref — el repo org se llama literalmente ".github",
# así que la ruta queda Coderic/.github/.github/workflows/... (no es un typo).
on:
  push:
    branches: ["$default-branch"]
  pull_request:
    branches: ["$default-branch"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  quality:
    uses: Coderic/.github/.github/workflows/portal-ci.yml@master
    secrets: inherit
    with:
      node-version: "20"
      run-build: false
